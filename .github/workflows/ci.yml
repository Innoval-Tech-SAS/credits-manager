name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_EXTENSIONS: mbstring, bcmath, intl, zip, gd, pdo_mysql, pdo_sqlite, redis, pcntl

jobs:
  api:
    name: API (Pint + PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      # Las pruebas de integración de Redis se omiten si no hay Redis; aquí sí corren.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          # Mismos límites que la imagen (api/docker/php/uploads.ini).
          ini-values: upload_max_filesize=20M, post_max_size=21M
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Pruebas (PHPUnit)
        run: vendor/bin/phpunit --no-coverage
        env:
          REDIS_HOST: 127.0.0.1

  migraciones:
    # Las pruebas usan SQLite; este job corre todas las migraciones contra MySQL 8.4,
    # igual que producción (triggers de solo inserción incluidos).
    name: Migraciones en MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: credits_manager
          MYSQL_USER: credits
          MYSQL_PASSWORD: credits
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: ci
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: credits_manager
      DB_USERNAME: credits
      DB_PASSWORD: credits
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Igualar la configuración de MySQL de producción (mysql/my.cnf y docker-compose.yaml)
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            SET GLOBAL time_zone = '-05:00';"

      - name: Clave de aplicación desechable
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Migrar desde cero
        run: php artisan migrate --force

  client:
    name: Cliente (lint + pruebas + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # Misma versión que nginx/Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  imagenes:
    # Confirma que las imágenes de producción construyen; no publica nada.
    name: Imágenes de producción
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Imagen api
        run: docker build --file api/Dockerfile api

      - name: Imagen nginx (incluye la SPA)
        run: docker build --file nginx/Dockerfile .
