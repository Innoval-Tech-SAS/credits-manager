server {
    listen 80;
    server_name api.ddasolucionescredicias.tech app.ddasolucionescredicias.tech phpmyadmin.ddasolucionescredicias.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.ddasolucionescredicias.tech;

    ssl_certificate     /etc/letsencrypt/live/api.ddasolucionescredicias.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddasolucionescredicias.tech/privkey.pem;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket de Laravel Reverb (protocolo Pusher: /app/{key}).
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name app.ddasolucionescredicias.tech;

    ssl_certificate     /etc/letsencrypt/live/api.ddasolucionescredicias.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddasolucionescredicias.tech/privkey.pem;

    root /var/www/html/app;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    server_name phpmyadmin.ddasolucionescredicias.tech;

    ssl_certificate     /etc/letsencrypt/live/api.ddasolucionescredicias.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddasolucionescredicias.tech/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
